# Fixed small LightGBM config for the B1 / B2 baselines (playbook Step 6; PIPELINE_v2 §9).
# B1 = LightGBM on the concatenation of all four blocks (RAW features, NaN native) + 4 mask bits.
# B2 = the same config applied to a single block, restricted to episodes where that modality is present.
# Kept deliberately small and fixed across arms so the comparison is about inputs, not tuning.

objective: multiclass
num_class: 3
metric: multi_logloss
num_leaves: 31
learning_rate: 0.05
feature_fraction: 0.5
bagging_fraction: 0.8
bagging_freq: 1
class_weight: null
verbosity: -1
deterministic: true
force_row_wise: true

# Boosting budget: up to this many rounds, early stopping on the validation split (multi_logloss).
num_rounds: 1000
early_stopping: 50
