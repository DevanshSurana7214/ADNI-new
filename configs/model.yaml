# Step 7 model configuration (A0: plain cross-entropy)
# Input widths: MRI 508, FDG 12, amy 324, tau 320 (Preprocessor output)

input_widths:
  mri: 508
  fdg: 12
  amy: 324
  tau: 320

model:
  dropout_p: 0.25  # modality dropout (train only)

training:
  seed: 0
  lr: 3e-4
  weight_decay: 0.05
  batch_size: 256
  max_epochs: 100
  early_stopping_patience: 15
